[package]
name = "pop-mail-server"
version = "0.1.0"
edition = "2021"
authors = ["POP3 Server Team"]
description = "A secure POP3 mail server implemented in Rust"
license = "MIT"
repository = "https://github.com/example/pop-mail-server"
rust-version = "1.75"

[[bin]]
name = "pop3-server"
path = "src/main.rs"

[[bin]]
name = "pop3ctl"
path = "src/bin/pop3ctl.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# TLS
tokio-rustls = "0.26"
rustls = "0.23"
rustls-pemfile = "2"

# Mail storage
maildir = "0.6"

# Authentication
argon2 = "0.5"
rand = "0.8"

# Configuration
toml = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Rate limiting
governor = "0.6"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# S3 storage (optional)
aws-sdk-s3 = { version = "1", optional = true }
aws-config = { version = "1", optional = true }

# Webhook
reqwest = { version = "0.12", features = ["json"] }

# Management API
axum = "0.7"
tower = "0.5"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# CLI
clap = { version = "4", features = ["derive", "env"] }

# IMAP forwarding
async-imap = "0.10"
async-native-tls = "0.5"
async-std = { version = "1", features = ["attributes"] }

# Error handling
thiserror = "1"
anyhow = "1"

# Security
zeroize = "1"

# Async trait
async-trait = "0.1"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# UUID for message IDs
uuid = { version = "1", features = ["v4"] }

# Hex encoding for UIDL
hex = "0.4"

# MD5 for APOP (optional)
md5 = "0.7"

# Notify for file watching
notify = "6"

# Tokio utilities
tokio-util = { version = "0.7", features = ["codec"] }

# Bytes for efficient buffer handling
bytes = "1"

# Futures utilities
futures = "0.3"

[dev-dependencies]
tempfile = "3"
tokio-test = "0.4"

[features]
default = []
s3 = ["aws-sdk-s3", "aws-config"]
